<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

    <header> <!--NO HTML semântico <header> é o cabeçalho-->
        <a class="link-header">HOME</a>
        <a class="link-header">ABOUT</a>
        <a class="link-header">SERVICE</a>
        <a class="link-header">CONTACT</a>
        <!--Criamos um link em cada elemento do header para poder estilizar-->

        <button class="button-header">LOG IN</button>
        <!--para estilizar o botção no Css também crio uma classe-->
    </header>

    <main> <!--o main indicando esta "caixa" como principal (HTML semântico)-->

        <img src="Imagem/Illustration 2.png" class="logo-image">
        <!--fiz uma classe para imagem para poder no css editar o tamanho-->

        <section> <!--vamos criar uma SEÇÃO para colocar o texto ao lado da imagem, em outra "caixa"-->

            <h1>WE CARE</h1>

            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Sunt voluptate ea placeat iure. Ut temporibus
                libero at, reiciendis similique atque magnam quo iste magni delectus corporis ipsum culpa officiis.
            </p>

            <button class="button-main">EXPLORE</button> <!--fiz uma classe para o botão para poder estilizar no CSS-->


        </section>






    </main>
